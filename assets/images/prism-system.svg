<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e2b"/>
      <stop offset="50%" stop-color="#2c1445"/>
      <stop offset="100%" stop-color="#120720"/>
    </linearGradient>
    <linearGradient id="p-blush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="p-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="p-shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#ec4899" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#p-bg)"/>
  <circle cx="200" cy="180" r="180" fill="#f472b6" opacity="0.14" filter="blur(70px)"/>
  <circle cx="620" cy="320" r="180" fill="#a855f7" opacity="0.16" filter="blur(70px)"/>

  <!-- Design System Spec Sheet Container -->
  <g transform="translate(50, 40)" filter="url(#p-shadow)">
    <rect width="700" height="420" rx="20" fill="rgba(26,13,42,0.85)" stroke="rgba(244,114,182,0.3)" stroke-width="1.5"/>

    <!-- Header bar -->
    <g transform="translate(25, 24)">
      <text x="0" y="20" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700">PRISM DESIGN SYSTEM</text>
      <text x="0" y="40" fill="#d8b4fe" font-family="'JetBrains Mono', monospace" font-size="11">v2.4.0 • 48 Accessible Components • Zero Layout Shift</text>
      
      <!-- Badges -->
      <rect x="520" y="4" width="60" height="24" rx="12" fill="rgba(244,114,182,0.2)"/>
      <text x="532" y="20" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="10">WCAG AAA</text>

      <rect x="590" y="4" width="60" height="24" rx="12" fill="rgba(192,132,252,0.2)"/>
      <text x="604" y="20" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10">FIGMA + TS</text>
    </g>

    <!-- Color Swatches Row -->
    <g transform="translate(25, 80)">
      <text x="0" y="16" fill="#e9d5ff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">COLOR HARMONY TOKENS</text>
      <g transform="translate(0, 26)">
        <!-- Swatch 1 -->
        <rect x="0" y="0" width="75" height="50" rx="10" fill="#fdf2f8"/>
        <text x="6" y="70" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5">blush-50</text>
        <!-- Swatch 2 -->
        <rect x="85" y="0" width="75" height="50" rx="10" fill="#fbcfe8"/>
        <text x="91" y="70" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5">blush-200</text>
        <!-- Swatch 3 -->
        <rect x="170" y="0" width="75" height="50" rx="10" fill="#f472b6"/>
        <text x="176" y="70" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5">blush-400</text>
        <!-- Swatch 4 -->
        <rect x="255" y="0" width="75" height="50" rx="10" fill="#db2777"/>
        <text x="261" y="70" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5">blush-600</text>
        <!-- Swatch 5 -->
        <rect x="340" y="0" width="75" height="50" rx="10" fill="#e9d5ff"/>
        <text x="346" y="70" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5">lilac-200</text>
        <!-- Swatch 6 -->
        <rect x="425" y="0" width="75" height="50" rx="10" fill="#c084fc"/>
        <text x="431" y="70" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5">lilac-400</text>
        <!-- Swatch 7 -->
        <rect x="510" y="0" width="75" height="50" rx="10" fill="#7e22ce"/>
        <text x="516" y="70" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5">plum-700</text>
        <!-- Swatch 8 -->
        <rect x="595" y="0" width="55" height="50" rx="10" fill="#170928" stroke="rgba(244,114,182,0.4)" stroke-width="1"/>
        <text x="600" y="70" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9.5">obsidian</text>
      </g>
    </g>

    <!-- Interactive Component Specs Grid -->
    <g transform="translate(25, 200)">
      <text x="0" y="16" fill="#e9d5ff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">INTERACTIVE VARIANTS &amp; HAPTIC STATES</text>
      
      <!-- Component Card 1: Buttons -->
      <g transform="translate(0, 30)">
        <rect width="200" height="150" rx="14" fill="rgba(15,7,25,0.7)" stroke="rgba(244,114,182,0.2)" stroke-width="1"/>
        <text x="16" y="24" fill="#a8a29e" font-family="'JetBrains Mono', monospace" font-size="10">BUTTON PRIMITIVES</text>
        
        <!-- Primary -->
        <rect x="16" y="38" width="168" height="32" rx="8" fill="url(#p-blush)"/>
        <text x="100" y="58" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Primary Shimmer</text>
        
        <!-- Secondary / Outline -->
        <rect x="16" y="80" width="168" height="32" rx="8" fill="rgba(244,114,182,0.08)" stroke="rgba(244,114,182,0.4)" stroke-width="1"/>
        <text x="100" y="100" text-anchor="middle" fill="#f472b6" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500">Secondary Glass</text>
        
        <text x="16" y="132" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9">focus: ring-2 ring-blush</text>
      </g>

      <!-- Component Card 2: Switches & Radio Tokens -->
      <g transform="translate(225, 30)">
        <rect width="200" height="150" rx="14" fill="rgba(15,7,25,0.7)" stroke="rgba(244,114,182,0.2)" stroke-width="1"/>
        <text x="16" y="24" fill="#a8a29e" font-family="'JetBrains Mono', monospace" font-size="10">TOGGLES &amp; PILLS</text>

        <!-- Toggle active -->
        <rect x="16" y="44" width="46" height="26" rx="13" fill="url(#p-purple)"/>
        <circle cx="48" cy="57" r="10" fill="#ffffff"/>
        <text x="74" y="61" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Active State</text>

        <!-- Toggle inactive -->
        <rect x="16" y="82" width="46" height="26" rx="13" fill="rgba(255,255,255,0.12)"/>
        <circle cx="29" cy="95" r="10" fill="#ffffff"/>
        <text x="74" y="99" fill="#a8a29e" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Resting State</text>

        <text x="16" y="132" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9">ARIA: aria-checked</text>
      </g>

      <!-- Component Card 3: Form Input -->
      <g transform="translate(450, 30)">
        <rect width="200" height="150" rx="14" fill="rgba(15,7,25,0.7)" stroke="rgba(244,114,182,0.2)" stroke-width="1"/>
        <text x="16" y="24" fill="#a8a29e" font-family="'JetBrains Mono', monospace" font-size="10">FLOATING INPUT</text>

        <rect x="16" y="42" width="168" height="42" rx="10" fill="rgba(255,255,255,0.04)" stroke="#f472b6" stroke-width="1.5"/>
        <text x="26" y="58" fill="#f472b6" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">INPUT LABEL</text>
        <text x="26" y="74" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">haziqa@design.dev</text>
        
        <rect x="16" y="100" width="70" height="24" rx="6" fill="rgba(244,114,182,0.15)"/>
        <text x="26" y="116" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="10">VALIDATED ✓</text>
      </g>
    </g>
  </g>
</svg>
