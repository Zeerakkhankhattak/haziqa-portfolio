<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29"/>
      <stop offset="50%" stop-color="#2a143d"/>
      <stop offset="100%" stop-color="#12081f"/>
    </linearGradient>
    <linearGradient id="blush-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="phone-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(244,114,182,0.2)"/>
      <stop offset="100%" stop-color="rgba(192,132,252,0.05)"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#ec4899" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#f472b6" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Ambient Orbs -->
  <circle cx="260" cy="180" r="140" fill="#f472b6" opacity="0.18" filter="blur(60px)"/>
  <circle cx="560" cy="340" r="160" fill="#a855f7" opacity="0.16" filter="blur(60px)"/>

  <!-- Left Feature Card: Biometrics Metric -->
  <g transform="translate(80, 110)">
    <rect width="210" height="150" rx="20" fill="#1f1435" stroke="rgba(244,114,182,0.3)" stroke-width="1" filter="url(#soft-shadow)"/>
    <text x="24" y="38" fill="#e9d5ff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" letter-spacing="1">CHRONOTYPE SCORE</text>
    <text x="24" y="80" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="700">94.8<tspan font-size="18" fill="#f472b6">%</tspan></text>
    <path d="M 24 115 C 60 95, 90 125, 130 100 C 160 85, 175 105, 186 95" fill="none" stroke="url(#blush-glow)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="186" cy="95" r="4" fill="#f472b6"/>
  </g>

  <!-- Floating Pill Card -->
  <g transform="translate(90, 300)">
    <rect width="190" height="85" rx="16" fill="rgba(31,20,53,0.85)" stroke="rgba(192,132,252,0.35)" stroke-width="1"/>
    <circle cx="45" cy="42" r="18" fill="rgba(244,114,182,0.2)"/>
    <path d="M 38 42 L 43 47 L 52 38" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
    <text x="75" y="38" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Deep REM Sync</text>
    <text x="75" y="56" fill="#a8a29e" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Optimal recovery</text>
  </g>

  <!-- Central Mobile Mockup Frame -->
  <g transform="translate(320, 45)">
    <!-- Device Shadow -->
    <rect x="0" y="0" width="220" height="420" rx="36" fill="#0f0717" stroke="rgba(244,114,182,0.4)" stroke-width="2.5" filter="url(#soft-shadow)"/>
    
    <!-- Dynamic Island / Speaker -->
    <rect x="80" y="14" width="60" height="14" rx="7" fill="#1b122c"/>
    <circle cx="125" cy="21" r="3" fill="#a855f7"/>

    <!-- Screen Content -->
    <g transform="translate(16, 42)">
      <text x="8" y="20" fill="#d8b4fe" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">AURA BIOMETRICS</text>
      <text x="8" y="42" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700">Good Evening, Haziqa</text>

      <!-- Circular Radial Ring -->
      <g transform="translate(94, 115)">
        <circle cx="0" cy="0" r="54" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="8"/>
        <circle cx="0" cy="0" r="54" fill="none" stroke="url(#blush-glow)" stroke-width="8" stroke-dasharray="270" stroke-dashoffset="65" stroke-linecap="round" transform="rotate(-90)"/>
        <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700">88</text>
        <text x="0" y="20" text-anchor="middle" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500">OPTIMAL</text>
      </g>

      <!-- Glass Action Card -->
      <rect x="6" y="195" width="176" height="60" rx="14" fill="url(#phone-glow)" stroke="rgba(244,114,182,0.25)" stroke-width="1"/>
      <text x="18" y="218" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Night Meditation</text>
      <text x="18" y="236" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Spatial soundscapes ready</text>
      <circle cx="160" cy="225" r="12" fill="#f472b6"/>
      <polygon points="158,220 165,225 158,230" fill="#ffffff"/>

      <!-- Bottom Nav Bar -->
      <g transform="translate(6, 290)">
        <rect width="176" height="42" rx="21" fill="rgba(18,9,33,0.9)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <circle cx="34" cy="21" r="5" fill="#f472b6"/>
        <circle cx="88" cy="21" r="5" fill="rgba(255,255,255,0.3)"/>
        <circle cx="142" cy="21" r="5" fill="rgba(255,255,255,0.3)"/>
      </g>
    </g>
  </g>

  <!-- Right Floating Metric Card -->
  <g transform="translate(565, 140)">
    <rect width="175" height="190" rx="20" fill="#1d1233" stroke="rgba(192,132,252,0.3)" stroke-width="1" filter="url(#soft-shadow)"/>
    <text x="20" y="36" fill="#f472b6" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">CIRCADIAN CURVE</text>
    
    <!-- Mini Bars -->
    <g transform="translate(20, 60)">
      <rect x="0" y="35" width="14" height="45" rx="7" fill="rgba(244,114,182,0.2)"/>
      <rect x="22" y="20" width="14" height="60" rx="7" fill="rgba(244,114,182,0.35)"/>
      <rect x="44" y="5" width="14" height="75" rx="7" fill="url(#blush-glow)"/>
      <rect x="66" y="28" width="14" height="52" rx="7" fill="rgba(192,132,252,0.35)"/>
      <rect x="88" y="40" width="14" height="40" rx="7" fill="rgba(192,132,252,0.2)"/>
      <rect x="110" y="15" width="14" height="65" rx="7" fill="rgba(244,114,182,0.4)"/>
    </g>
    <text x="20" y="165" fill="#e9d5ff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500">+18% Sleep Quality</text>
  </g>
</svg>
