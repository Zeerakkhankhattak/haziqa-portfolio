<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="ciroa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d0e26"/>
      <stop offset="50%" stop-color="#2d133b"/>
      <stop offset="100%" stop-color="#15081e"/>
    </linearGradient>
    <linearGradient id="pastel-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <linearGradient id="ciroa-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(48, 20, 64, 0.75)"/>
      <stop offset="100%" stop-color="rgba(24, 10, 34, 0.85)"/>
    </linearGradient>
    <filter id="ciroa-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#f472b6" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#ciroa-bg)"/>

  <!-- Subtle Pastel Blush Blobs -->
  <circle cx="270" cy="200" r="170" fill="#f472b6" opacity="0.18" filter="blur(70px)"/>
  <circle cx="580" cy="290" r="160" fill="#fda4af" opacity="0.14" filter="blur(70px)"/>

  <!-- Left Card: E-Commerce Product Experience -->
  <g transform="translate(80, 65)" filter="url(#ciroa-glow)">
    <rect width="330" height="370" rx="24" fill="url(#ciroa-card)" stroke="rgba(244,114,182,0.35)" stroke-width="1.5"/>
    
    <rect x="24" y="24" width="136" height="24" rx="12" fill="rgba(244,114,182,0.15)"/>
    <text x="36" y="40" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">LUXURY E-COMMERCE</text>

    <text x="24" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="22" font-weight="800">Ciroa Cosmetics</text>
    <text x="24" y="104" fill="#d1d5db" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">Vibrant Skin & Hair Care Platform</text>

    <!-- Product Card Showcase inside -->
    <rect x="24" y="128" width="282" height="135" rx="16" fill="rgba(20,8,28,0.6)" stroke="rgba(255,255,255,0.08)"/>
    
    <!-- Botanical Serum Bottle Icon/Visual -->
    <rect x="44" y="148" width="56" height="95" rx="14" fill="rgba(244,114,182,0.2)" stroke="#f472b6" stroke-width="1.5"/>
    <rect x="62" y="138" width="20" height="12" rx="4" fill="#fda4af"/>
    <circle cx="72" cy="190" r="8" fill="#ffffff" opacity="0.6"/>

    <text x="114" y="168" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700">Luminous Glow Serum</text>
    <text x="114" y="188" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Niacinamide + Rose Hydrosol</text>
    <text x="114" y="214" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="800">$48.00</text>
    <rect x="194" y="198" width="94" height="26" rx="13" fill="url(#pastel-glow)"/>
    <text x="241" y="215" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">+ Add to Bag</text>

    <!-- Category Tabs -->
    <g transform="translate(24, 280)">
      <rect x="0" y="0" width="86" height="30" rx="15" fill="rgba(244,114,182,0.18)" stroke="#f472b6"/>
      <text x="43" y="19" text-anchor="middle" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">Skincare</text>

      <rect x="94" y="0" width="86" height="30" rx="15" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="137" y="19" text-anchor="middle" fill="#d1d5db" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">Haircare</text>

      <rect x="188" y="0" width="94" height="30" rx="15" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
      <text x="235" y="19" text-anchor="middle" fill="#d1d5db" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">Bundles</text>
    </g>

    <rect x="24" y="324" width="282" height="32" rx="16" fill="url(#pastel-glow)"/>
    <text x="165" y="345" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="700">Delightful Omnichannel Checkout</text>
  </g>

  <!-- Right Floating Metric Card -->
  <g transform="translate(450, 110)">
    <rect width="260" height="145" rx="20" fill="url(#ciroa-card)" stroke="rgba(244,114,182,0.3)" stroke-width="1.2"/>
    <text x="24" y="36" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" letter-spacing="1">USER SATISFACTION</text>
    <text x="24" y="68" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="28" font-weight="800">96.4%</text>
    <text x="24" y="92" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Positive Visual Aesthetics Rating</text>
    <text x="24" y="126" fill="#25d366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">✓ Responsive Web & Mobile App</text>
  </g>

  <!-- Right Lower Feature: Live Project -->
  <g transform="translate(450, 285)">
    <rect width="260" height="135" rx="20" fill="url(#ciroa-card)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="24" y="34" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">Live Delivery</text>
    <text x="24" y="66" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">Production Cosmetics E-Store</text>
    
    <rect x="24" y="86" width="100" height="26" rx="8" fill="rgba(244,114,182,0.15)"/>
    <text x="36" y="103" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">Figma & Web</text>
  </g>
</svg>
