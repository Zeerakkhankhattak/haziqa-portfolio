<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sauna-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e20"/>
      <stop offset="50%" stop-color="#2a142e"/>
      <stop offset="100%" stop-color="#120617"/>
    </linearGradient>
    <linearGradient id="warmth-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="sauna-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(48, 22, 54, 0.75)"/>
      <stop offset="100%" stop-color="rgba(24, 9, 30, 0.85)"/>
    </linearGradient>
    <filter id="warm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#fb923c" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#sauna-bg)"/>

  <!-- Ambient Infrared Thermal Glows -->
  <circle cx="260" cy="200" r="180" fill="#fb923c" opacity="0.16" filter="blur(70px)"/>
  <circle cx="580" cy="300" r="150" fill="#f43f5e" opacity="0.14" filter="blur(70px)"/>

  <!-- Left Card: Therapy Session Dashboard -->
  <g transform="translate(80, 65)" filter="url(#warm-glow)">
    <rect width="330" height="370" rx="24" fill="url(#sauna-glass)" stroke="rgba(251,146,60,0.35)" stroke-width="1.5"/>
    
    <rect x="24" y="24" width="134" height="24" rx="12" fill="rgba(251,146,60,0.15)"/>
    <text x="36" y="40" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">THERMAL WELLNESS</text>

    <text x="24" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="22" font-weight="800">Lucent Saunas</text>
    <text x="24" y="104" fill="#d1d5db" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">Infrared Light Therapy Experience</text>

    <!-- Temperature & Spectrum Curve -->
    <rect x="24" y="128" width="282" height="130" rx="16" fill="rgba(18,7,24,0.6)" stroke="rgba(255,255,255,0.08)"/>
    <text x="44" y="156" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Near & Far Infrared Spectrum</text>
    
    <!-- Smooth Thermal Waveform -->
    <path d="M 44 220 Q 90 160 140 190 T 230 170 T 290 200" fill="none" stroke="url(#warmth-grad)" stroke-width="3.5" stroke-linecap="round"/>
    
    <text x="44" y="196" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="26" font-weight="800">145°F</text>
    <text x="120" y="196" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="700">Optimal Detox Zone</text>

    <!-- Health Benefits Grid -->
    <g transform="translate(24, 276)">
      <rect x="0" y="0" width="88" height="34" rx="8" fill="rgba(251,146,60,0.12)" stroke="rgba(251,146,60,0.3)"/>
      <text x="44" y="21" text-anchor="middle" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">Detox</text>

      <rect x="96" y="0" width="88" height="34" rx="8" fill="rgba(251,146,60,0.12)" stroke="rgba(251,146,60,0.3)"/>
      <text x="140" y="21" text-anchor="middle" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">Relaxation</text>

      <rect x="192" y="0" width="90" height="34" rx="8" fill="rgba(251,146,60,0.12)" stroke="rgba(251,146,60,0.3)"/>
      <text x="237" y="21" text-anchor="middle" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">Pain Relief</text>
    </g>

    <rect x="24" y="322" width="282" height="34" rx="17" fill="url(#warmth-grad)"/>
    <text x="165" y="344" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="700">Explore Infrared Technology</text>
  </g>

  <!-- Right Floating Metric Card -->
  <g transform="translate(450, 110)">
    <rect width="260" height="145" rx="20" fill="url(#sauna-glass)" stroke="rgba(251,146,60,0.3)" stroke-width="1.2"/>
    <text x="24" y="36" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" letter-spacing="1">E-COMMERCE CONVERSION</text>
    <text x="24" y="68" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="28" font-weight="800">+64%</text>
    <text x="24" y="92" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Interactive Consultation Bookings</text>
    <text x="24" y="126" fill="#25d366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">✓ Seamless Luxury Aesthetics</text>
  </g>

  <!-- Right Lower Feature: Live Website Launch -->
  <g transform="translate(450, 285)">
    <rect width="260" height="135" rx="20" fill="url(#sauna-glass)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="24" y="34" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">Design Deliverable</text>
    <text x="24" y="66" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">Production Web Experience</text>
    
    <rect x="24" y="86" width="104" height="26" rx="8" fill="rgba(251,146,60,0.15)"/>
    <text x="36" y="103" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">Figma & Live</text>
  </g>
</svg>
