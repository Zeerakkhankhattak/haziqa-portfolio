<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="careager-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a22"/>
      <stop offset="60%" stop-color="#1f0f33"/>
      <stop offset="100%" stop-color="#0e0517"/>
    </linearGradient>
    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(42, 20, 68, 0.75)"/>
      <stop offset="100%" stop-color="rgba(24, 11, 38, 0.85)"/>
    </linearGradient>
    <filter id="radar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#f43f5e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#careager-bg)"/>

  <!-- Subtle Navigation Radar Grids -->
  <g opacity="0.1" stroke="#f43f5e" stroke-width="1">
    <circle cx="400" cy="250" r="120" fill="none"/>
    <circle cx="400" cy="250" r="220" fill="none"/>
    <circle cx="400" cy="250" r="320" fill="none"/>
    <line x1="80" y1="250" x2="720" y2="250"/>
    <line x1="400" y1="30" x2="400" y2="470"/>
  </g>

  <!-- Ambient Glows -->
  <circle cx="280" cy="220" r="160" fill="#f43f5e" opacity="0.16" filter="blur(60px)"/>
  <circle cx="560" cy="300" r="140" fill="#f59e0b" opacity="0.14" filter="blur(60px)"/>

  <!-- Left Card: Emergency SOS Active Card -->
  <g transform="translate(90, 70)" filter="url(#radar-glow)">
    <rect width="320" height="360" rx="24" fill="url(#card-glass)" stroke="rgba(244,63,94,0.4)" stroke-width="1.5"/>
    
    <!-- Top Status Row -->
    <rect x="24" y="24" width="76" height="24" rx="12" fill="rgba(244,63,94,0.18)" stroke="rgba(244,63,94,0.4)"/>
    <circle cx="36" cy="36" r="4" fill="#f43f5e"/>
    <text x="46" y="40" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">LIVE SOS</text>
    
    <text x="24" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="22" font-weight="800">CarEager Dispatch</text>
    <text x="24" y="104" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">24/7 Roadside & Tow Assistance</text>

    <!-- Map Preview Box -->
    <rect x="24" y="126" width="272" height="130" rx="16" fill="rgba(15,7,25,0.7)" stroke="rgba(255,255,255,0.08)"/>
    <path d="M 40 210 Q 120 160 180 200 T 280 150" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6,4"/>
    
    <!-- Service Vehicle Pin -->
    <circle cx="180" cy="200" r="14" fill="#f43f5e"/>
    <circle cx="180" cy="200" r="6" fill="#ffffff"/>
    
    <!-- ETA Tag -->
    <rect x="198" y="185" width="84" height="28" rx="8" fill="#180e29" stroke="rgba(244,63,94,0.4)"/>
    <text x="208" y="203" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">ETA: 8 MINS</text>

    <!-- Action Button -->
    <rect x="24" y="278" width="272" height="52" rx="26" fill="url(#amber-accent)"/>
    <text x="160" y="310" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700">One-Tap Mechanic En Route</text>
  </g>

  <!-- Right Floating Metric Card -->
  <g transform="translate(450, 110)">
    <rect width="260" height="150" rx="20" fill="url(#card-glass)" stroke="rgba(244,114,182,0.3)" stroke-width="1.2"/>
    <text x="24" y="38" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" letter-spacing="1">USER TESTED PERSONA</text>
    <text x="24" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="28" font-weight="800">4.9 / 5.0</text>
    <text x="24" y="94" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Emergency Incident Resolution</text>
    <line x1="24" y1="116" x2="236" y2="116" stroke="rgba(255,255,255,0.1)"/>
    <text x="24" y="134" fill="#25d366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">✓ Tested on 120+ roadside scenarios</text>
  </g>

  <!-- Right Lower Feature: Vehicle Telemetry -->
  <g transform="translate(450, 285)">
    <rect width="260" height="135" rx="20" fill="url(#card-glass)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="24" y="34" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">Vehicle Diagnostic Sync</text>
    <text x="24" y="66" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="18" font-weight="700">Battery & Tire Pressure OK</text>
    
    <rect x="24" y="86" width="68" height="26" rx="8" fill="rgba(245,158,11,0.15)"/>
    <text x="36" y="103" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">OBD-II</text>
    
    <rect x="100" y="86" width="76" height="26" rx="8" fill="rgba(244,114,182,0.15)"/>
    <text x="112" y="103" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700">Figma Proto</text>
  </g>
</svg>
