<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="av-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1245"/>
      <stop offset="50%" stop-color="#1f0a30"/>
      <stop offset="100%" stop-color="#0f051a"/>
    </linearGradient>
    <linearGradient id="av-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="av-glow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f472b6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="300" height="300" rx="150" fill="url(#av-bg)"/>
  
  <!-- Outer glowing rings -->
  <circle cx="150" cy="150" r="138" fill="none" stroke="url(#av-grad)" stroke-width="2" stroke-dasharray="12,6" opacity="0.6"/>
  <circle cx="150" cy="150" r="126" fill="none" stroke="rgba(244,114,182,0.3)" stroke-width="1"/>

  <!-- Center Monogram -->
  <circle cx="150" cy="150" r="105" fill="rgba(38,15,61,0.85)" stroke="rgba(244,114,182,0.4)" stroke-width="1.5" filter="url(#av-glow)"/>
  
  <!-- Stylized Monogram "HKK" -->
  <text x="150" y="166" text-anchor="middle" fill="url(#av-grad)" font-family="'Instrument Serif', serif" font-size="78" font-style="italic" font-weight="600" letter-spacing="-2">HK</text>

  <!-- Sparkle Stars -->
  <g transform="translate(195, 80)">
    <polygon points="12,0 15,9 24,12 15,15 12,24 9,15 0,12 9,9" fill="#f472b6"/>
  </g>
  <g transform="translate(85, 205)">
    <polygon points="8,0 10,6 16,8 10,10 8,16 6,10 0,8 6,6" fill="#c084fc"/>
  </g>
</svg>
