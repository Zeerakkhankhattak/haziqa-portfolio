<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="s-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e29"/>
      <stop offset="50%" stop-color="#2a1240"/>
      <stop offset="100%" stop-color="#10061e"/>
    </linearGradient>
    <linearGradient id="s-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="s-drop">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#ec4899" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#s-bg)"/>
  <circle cx="300" cy="150" r="160" fill="#f472b6" opacity="0.16" filter="blur(65px)"/>
  <circle cx="650" cy="350" r="150" fill="#9333ea" opacity="0.18" filter="blur(65px)"/>

  <!-- Main Canvas Container -->
  <g transform="translate(50, 45)" filter="url(#s-drop)">
    <rect width="700" height="410" rx="18" fill="rgba(24,11,38,0.85)" stroke="rgba(244,114,182,0.3)" stroke-width="1.5"/>

    <!-- App Header -->
    <rect width="700" height="42" rx="18" fill="rgba(16,7,26,0.95)"/>
    <path d="M 0 20 Q 0 42 20 42 L 680 42 Q 700 42 700 20 L 700 42 L 0 42 Z" fill="rgba(16,7,26,0.95)"/>
    <!-- Tabs -->
    <text x="28" y="26" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">SCRIBE.DEV</text>
    <rect x="140" y="8" width="120" height="26" rx="6" fill="rgba(244,114,182,0.18)"/>
    <text x="156" y="25" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500">Design Canvas</text>
    <rect x="270" y="8" width="120" height="26" rx="6" fill="transparent"/>
    <text x="286" y="25" fill="#a8a29e" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">AST Code Sync</text>
    
    <rect x="580" y="8" width="95" height="26" rx="6" fill="url(#s-grad)"/>
    <text x="600" y="25" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Sync tokens ⚡</text>

    <!-- Left Split: Visual Canvas Nodes -->
    <g transform="translate(20, 58)">
      <rect width="320" height="332" rx="12" fill="rgba(14,6,24,0.6)" stroke="rgba(244,114,182,0.15)" stroke-width="1"/>
      <text x="16" y="26" fill="#d8b4fe" font-family="'JetBrains Mono', monospace" font-size="10">CANVAS VIEWPORT [320 x 300]</text>
      
      <!-- Component Node 1 -->
      <g transform="translate(24, 45)">
        <rect width="270" height="115" rx="12" fill="rgba(38,18,58,0.7)" stroke="#f472b6" stroke-width="1.5"/>
        <text x="14" y="24" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="10">&lt;HeroBanner variant="blush"&gt;</text>
        <rect x="14" y="38" width="180" height="16" rx="4" fill="rgba(255,255,255,0.1)"/>
        <rect x="14" y="62" width="120" height="10" rx="3" fill="rgba(255,255,255,0.06)"/>
        <rect x="14" y="82" width="80" height="20" rx="6" fill="url(#s-grad)"/>
        <!-- Connection node dot -->
        <circle cx="270" cy="58" r="5" fill="#f472b6"/>
      </g>

      <!-- Component Node 2 -->
      <g transform="translate(24, 185)">
        <rect width="270" height="105" rx="12" fill="rgba(38,18,58,0.7)" stroke="rgba(192,132,252,0.4)" stroke-width="1"/>
        <text x="14" y="24" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10">&lt;MetricsGrid columns={3}&gt;</text>
        <rect x="14" y="38" width="70" height="45" rx="6" fill="rgba(255,255,255,0.05)"/>
        <rect x="94" y="38" width="70" height="45" rx="6" fill="rgba(255,255,255,0.05)"/>
        <rect x="174" y="38" width="70" height="45" rx="6" fill="rgba(255,255,255,0.05)"/>
        <circle cx="270" cy="52" r="5" fill="#c084fc"/>
      </g>
    </g>

    <!-- Dynamic Curved Wire Bridge -->
    <path d="M 364 161 C 410 161, 380 200, 420 200" fill="none" stroke="url(#s-grad)" stroke-width="2.5" stroke-dasharray="6,4"/>

    <!-- Right Split: Live React / TypeScript Code Editor -->
    <g transform="translate(360, 58)">
      <rect width="320" height="332" rx="12" fill="rgba(11,4,20,0.8)" stroke="rgba(192,132,252,0.2)" stroke-width="1"/>
      
      <!-- Code Editor Bar -->
      <g transform="translate(16, 20)">
        <circle cx="6" cy="6" r="3" fill="#f472b6"/>
        <text x="18" y="9" fill="#e9d5ff" font-family="'JetBrains Mono', monospace" font-size="10">HeroBanner.tsx (Generated)</text>
      </g>

      <!-- Code Syntax Highlighted Lines -->
      <g transform="translate(16, 50)" font-family="'JetBrains Mono', monospace" font-size="10.5">
        <text y="0" fill="#f472b6">import <tspan fill="#ffffff">{ useThemeTokens }</tspan> from <tspan fill="#a7f3d0">'@scribe/core'</tspan>;</text>
        <text y="24" fill="#f472b6">export const <tspan fill="#67e8f9">HeroBanner</tspan> = () => {</text>
        <text y="48" fill="#a8a29e">  const { tokens } = useThemeTokens();</text>
        <text y="72" fill="#f472b6">  return (</text>
        <text y="96" fill="#fbcfe8">    &lt;div className="glow-container"&gt;</text>
        <text y="120" fill="#ffffff">      &lt;h1 style={{ color: tokens.blush900 }}&gt;</text>
        <text y="144" fill="#a8a29e">        Elevate Your Digital Space</text>
        <text y="168" fill="#ffffff">      &lt;/h1&gt;</text>
        <text y="192" fill="#fbcfe8">      &lt;ShimmerButton glow="orchid"&gt;</text>
        <text y="216" fill="#a8a29e">        Get Started →</text>
        <text y="240" fill="#fbcfe8">      &lt;/ShimmerButton&gt;</text>
        <text y="264" fill="#f472b6">    &lt;/div&gt;</text>
        <text y="288" fill="#f472b6">  );</text>
        <text y="312" fill="#f472b6">};</text>
      </g>
    </g>
  </g>
</svg>
